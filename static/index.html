<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mote · SensX25</title>
  <style>
    :root {
      --bg: #14110e;
      --ink: #f4efe7;
      --muted: #b3a394;
      --faint: #6f6458;
      --paper: #f3eadb;
      --paper-ink: #241c16;
      --line: rgba(244, 239, 231, 0.12);
      --load: 0;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 50% 28%, rgba(214, 154, 86, calc(0.08 + var(--load) * 0.22)), transparent 62%),
        var(--bg);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      letter-spacing: 0.01em;
    }

    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 22px 22px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    .mark {
      margin: 0;
      color: var(--faint);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 4px 0 0;
      font-family: Palatino, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-weight: 500;
      font-size: 2.4rem;
      letter-spacing: -0.03em;
    }

    .status {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: right;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(220px, 0.7fr);
      gap: 36px;
      align-items: center;
      padding: 18px 0 10px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .mote {
      --body: #e4c7a1;
      --cheek: transparent;
      width: 240px;
      height: 230px;
      position: relative;
      margin-bottom: -18px;
    }

    .shadow {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 120px;
      height: 18px;
      transform: translateX(-50%) scaleX(calc(1 + var(--load) * 0.35));
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.45), transparent 70%);
    }

    .bob {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      animation: breathe 4.8s ease-in-out infinite;
    }

    .body {
      width: 168px;
      height: 150px;
      border-radius: 58% 58% 50% 50%;
      background:
        radial-gradient(circle at 50% 108%, var(--cheek), transparent 28%),
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.28), transparent 26%),
        var(--body);
      transform: scale(calc(0.96 + var(--load) * 0.08), calc(1 - var(--load) * 0.14));
      transition: transform 0.12s ease-out, background 0.35s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding-top: 8px;
    }

    .eyes { display: flex; gap: 22px; }

    .eye {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 42%, #1a1612 17%, #f7f1e8 18%);
      transition: height 0.25s ease, transform 0.25s ease, background 0.25s ease;
    }

    .mouth {
      width: 46px;
      height: 16px;
      border: 3px solid #2a211b;
      border-top: 0;
      border-radius: 0 0 40px 40px;
      transition: all 0.25s ease;
    }

    .mote[data-emotion="waiting"] { --body: #6d645b; }
    .mote[data-emotion="waiting"] .eye {
      height: 6px;
      border-radius: 6px;
      background: #2a211b;
      margin-top: 12px;
    }
    .mote[data-emotion="waiting"] .mouth {
      width: 22px;
      height: 0;
      border: 0;
      border-bottom: 3px solid #2a211b;
      border-radius: 0;
    }
    .mote[data-emotion="waiting"] .bob { animation: none; }

    .mote[data-emotion="shy"] { --body: #c5d4dc; --cheek: rgba(214, 146, 146, 0.55); }
    .mote[data-emotion="shy"] .bob { animation: shy-hold 3.2s ease-in-out infinite; }
    .mote[data-emotion="shy"] .eye {
      height: 16px;
      border-radius: 0 0 16px 16px;
      background: radial-gradient(circle at 50% 130%, #1a1612 24%, #f7f1e8 25%);
    }
    .mote[data-emotion="shy"] .mouth { width: 26px; height: 8px; }

    .mote[data-emotion="calm"] { --body: #e6c7a2; }
    .mote[data-emotion="hesitant"] { --body: #d9cbb8; }
    .mote[data-emotion="hesitant"] .bob { animation: flicker 1.1s steps(2, end) infinite; }
    .mote[data-emotion="hesitant"] .mouth {
      width: 28px;
      height: 10px;
      border-radius: 0 0 20px 20px;
    }

    .mote[data-emotion="confident"] { --body: #f0d48a; }
    .mote[data-emotion="confident"] .body { width: 184px; height: 162px; }
    .mote[data-emotion="confident"] .mouth { width: 62px; height: 22px; }

    .mote[data-emotion="angry"] { --body: #e07a5f; }
    .mote[data-emotion="angry"] .eye.left { transform: rotate(-16deg) translateY(2px); height: 18px; }
    .mote[data-emotion="angry"] .eye.right { transform: rotate(16deg) translateY(2px); height: 18px; }
    .mote[data-emotion="angry"] .mouth {
      border-top: 3px solid #2a211b;
      border-bottom: 0;
      border-radius: 40px 40px 0 0;
      height: 14px;
    }

    .mote[data-emotion="anxious"] { --body: #e2b15a; }
    .mote[data-emotion="anxious"] .bob { animation: jitter 0.18s linear infinite; }
    .mote[data-emotion="anxious"] .eye {
      background: radial-gradient(circle at 50% 40%, #1a1612 28%, #f7f1e8 29%);
    }
    .mote[data-emotion="anxious"] .mouth {
      width: 22px;
      height: 22px;
      border: 3px solid #2a211b;
      border-radius: 50%;
    }

    .mote.thinking .eye { animation: blink 1s steps(2, end) infinite; }

    .card {
      width: min(100%, 520px);
      background: var(--paper);
      color: var(--paper-ink);
      border-radius: 18px;
      padding: 26px 26px 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    .emotion {
      margin: 0 0 8px;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8a7360;
    }

    .line {
      margin: 0;
      min-height: 4.6rem;
      font-family: Palatino, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: 1.65rem;
      line-height: 1.35;
      overflow-wrap: break-word;
    }

    .line:empty::after,
    .line.typing::after {
      content: "";
      display: inline-block;
      width: 0.55ch;
      height: 0.9em;
      margin-left: 2px;
      transform: translateY(2px);
      background: #241c16;
      animation: caret 0.9s steps(1) infinite;
    }

    .aside {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pad-label {
      margin: 0;
      color: var(--faint);
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: min(100%, 260px);
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 6px;
      background: #2a241c;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 0;
      width: min(100%, 260px);
    }

    .stats div {
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .stats dt {
      color: var(--faint);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stats dd {
      margin: 4px 0 0;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 1.15rem;
    }

    .evidence {
      margin: 0;
      max-width: 260px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      line-height: 1.45;
      min-height: 2.8em;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    footer p {
      margin: 0;
      color: var(--faint);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .keys { display: flex; flex-wrap: wrap; gap: 8px; }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.88rem;
      cursor: pointer;
    }

    button:hover { background: rgba(244, 239, 231, 0.06); }
    button:disabled { opacity: 0.4; cursor: default; }
    button[aria-pressed="true"] { background: var(--paper); color: var(--paper-ink); }

    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes shy-hold {
      0%, 100% { transform: translateY(6px); }
      50% { transform: translateY(10px); }
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }

    @keyframes jitter {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, -2px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes blink {
      0%, 70% { transform: none; }
      80%, 100% { transform: scaleY(0.15); }
    }

    @keyframes caret {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    @media (max-width: 800px) {
      .wrap { padding: 18px 16px 18px; }
      main { grid-template-columns: 1fr; gap: 12px; padding-top: 6px; }
      .aside { align-items: center; }
      .grid, .stats { width: 188px; }
      .evidence { max-width: 320px; text-align: center; }
      .mote { width: 180px; height: 168px; margin-bottom: -8px; }
      .body { width: 132px; height: 118px; }
      .status { text-align: left; }
      header { flex-direction: column; align-items: flex-start; }
      h1 { font-size: 2rem; }
      .line { font-size: 1.35rem; }
      .card { padding: 18px 16px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bob, .mote.thinking .eye, .line.typing::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="mark">SensX25</p>
        <h1>Mote</h1>
      </div>
      <p class="status" id="status">Waiting for the pad</p>
    </header>
    <main>
      <section class="stage">
        <div class="mote" id="mote" data-emotion="waiting">
          <div class="shadow"></div>
          <div class="bob">
            <div class="body">
              <div class="eyes">
                <span class="eye left"></span>
                <span class="eye right"></span>
              </div>
              <span class="mouth"></span>
            </div>
          </div>
        </div>
        <div class="card">
          <p class="emotion" id="emotion">Waiting</p>
          <p class="line" id="line" aria-live="polite"></p>
        </div>
      </section>
      <aside class="aside">
        <p class="pad-label">Sensing face</p>
        <div class="grid" id="grid" aria-hidden="true"></div>
        <dl class="stats">
          <div><dt>Total</dt><dd id="total">0</dd></div>
          <div><dt>Peak</dt><dd id="peak">0</dd></div>
          <div><dt>Cells</dt><dd id="cells">0</dd></div>
        </dl>
        <p class="evidence" id="evidence">A finished press lands here, with the numbers behind the guess.</p>
      </aside>
    </main>
    <footer>
      <p>Practice a press</p>
      <div class="keys" id="keys"></div>
    </footer>
  </div>
  <script>
    const KINDS = [
      ["shy", "Light, held"],
      ["hesitant", "Light taps"],
      ["calm", "Easy press"],
      ["confident", "Full palm"],
      ["angry", "Hard hit"],
      ["anxious", "Nervous taps"],
    ];

    const grid = document.getElementById("grid");
    const cells = [];
    for (let i = 0; i < 25; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      grid.appendChild(cell);
      cells.push(cell);
    }

    const keys = document.getElementById("keys");
    for (const [kind, hint] of KINDS) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = kind;
      button.title = hint;
      button.dataset.kind = kind;
      button.addEventListener("click", () => play(kind));
      keys.appendChild(button);
    }

    document.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLButtonElement) return;
      const index = Number(event.key) - 1;
      if (index >= 0 && index < KINDS.length) play(KINDS[index][0]);
    });

    let seenLine = -1;
    let typeTimer = null;

    function heat(value) {
      if (!value) return "#2a241c";
      const t = Math.sqrt(Math.min(1, value / 2000));
      const r = Math.round(58 + t * 197);
      const g = Math.round(42 + t * 150);
      const b = Math.round(28 + t * 50);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function typeLine(text) {
      const el = document.getElementById("line");
      if (typeTimer) clearInterval(typeTimer);
      el.textContent = "";
      el.classList.add("typing");
      let i = 0;
      typeTimer = setInterval(() => {
        i += 1;
        el.textContent = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(typeTimer);
          el.classList.remove("typing");
        }
      }, 26);
    }

    function render(state) {
      const emotion = state.emotion || "waiting";
      const mote = document.getElementById("mote");
      mote.dataset.emotion = emotion;
      mote.classList.toggle("thinking", !!state.thinking);
      const load = Math.max(0, Math.min(1, (state.peak || 0) / 1800));
      document.documentElement.style.setProperty("--load", load.toFixed(3));

      document.getElementById("emotion").textContent = state.thinking
        ? emotion + " · reading it"
        : emotion;

      if (state.line_id !== seenLine && state.line) {
        seenLine = state.line_id;
        typeLine(state.line);
      }

      const frame = state.grid || [];
      frame.forEach((row, r) => {
        row.forEach((value, c) => {
          cells[r * 5 + c].style.background = heat(value);
        });
      });
      document.getElementById("total").textContent = state.total ?? 0;
      document.getElementById("peak").textContent = state.peak ?? 0;
      document.getElementById("cells").textContent = state.pixels_on ?? 0;

      const evidence = document.getElementById("evidence");
      if (state.evidence) {
        const voice = state.source === "gemini" ? "Gemini" : "offline voice";
        evidence.textContent = state.evidence + " · " + voice;
      }

      const status = document.getElementById("status");
      if (!state.connected) status.textContent = "Waiting for the pad";
      else if (state.thinking) status.textContent = "Choosing the words";
      else if (state.touching) status.textContent = "Feeling the press";
      else if (state.mode === "practice" && !state.frames) status.textContent = "Practice mode";
      else status.textContent = "Pad is quiet";

      const busy = !!(state.demo || state.thinking);
      for (const button of keys.children) {
        button.disabled = busy;
        button.setAttribute("aria-pressed", state.demo === button.dataset.kind ? "true" : "false");
      }
    }

    async function play(kind) {
      const response = await fetch("/demo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind }),
      });
      if (!response.ok && response.status !== 202) {
        document.getElementById("status").textContent = "That practice press did not start";
      }
    }

    const source = new EventSource("/events");
    source.onmessage = (event) => render(JSON.parse(event.data));
    source.onerror = () => {
      document.getElementById("status").textContent = "Reconnecting to Mote";
    };
  </script>
</body>
</html>
